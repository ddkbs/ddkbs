<svg xmlns="http://www.w3.org/2000/svg" width="860" height="168" viewBox="0 0 860 168" role="img" aria-label="Triggers flowing through an agent into APIs, MCP servers and notes"><defs><style>
  .ring { transform-origin: 430px 84px; animation: ring 3s ease-out infinite; }
  .ring.b { animation-delay: 1.5s; }
  @keyframes ring { 0% { transform: scale(1); opacity: .5 } 100% { transform: scale(2.1); opacity: 0 } }
  .spin { transform-origin: 430px 84px; animation: spin 14s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0 } }
  .wire { stroke-dasharray: 2 6; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -16 } }
